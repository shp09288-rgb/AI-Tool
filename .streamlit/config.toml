# Streamlit 'C' 단축키/메뉴의 Clear cache가 캡처·입력 중 뜨는 것을 줄이기 위함
[client]
toolbarMode = "viewer"
showErrorDetails = "full"

[browser]
gatherUsageStats = false

# Apple-inspired light theme (Streamlit native tokens)
[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
font = "sans serif"
